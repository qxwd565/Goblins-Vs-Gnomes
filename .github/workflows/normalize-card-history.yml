name: Validate HScard API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'cards.json'
      - 'cards-date.json'
      - 'render*.json'
      - 'history*.json'
      - 'release-policy.json'
      - 'data/**'
      - 'metadata/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate API indexes with the committed builder
        run: |
          python3 tools/migrate-date-schema.py
          python3 tools/build-api.py
      - name: Validate GvG release and patch history
        run: python3 tools/test-gvg-history.py
      - name: Validate first real Arena availability, constructed release, and all 20 token parent IDs
        run: python3 tools/test-gvg-first-use.py
      - name: Validate date schema, source evidence, compatibility and reproducibility
        run: |
          python3 tools/test-date-schema.py
          python3 tools/test-gvg-mechanics.py
          python3 tools/test-legacy-compatibility.py
          python3 tools/test-build-idempotence.py
          python3 tools/test-clean-migration.py
          git diff --check
      - name: Verify committed indexes are current
        run: git diff --exit-code -- cards.json render.json history.json cards-date.json render-date.json history-date.json data metadata
